apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: echo-header
  name: echo-header
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-header
  template:
    metadata:
      labels:
        app: echo-header
    spec:
      containers:
      - image: 373797717611.dkr.ecr.eu-west-2.amazonaws.com/dev-arch-testing:0.0.0
        imagePullPolicy: Always
        name: echo-header
        ports:
        - containerPort: 8090
        resources:
          limits:
            memory: 128M
          requests:
            cpu: 100m
            memory: 128M
        securityContext:
          runAsUser: 1000
      nodeSelector:
        kubernetes.io/arch: amd64
      serviceAccountName: echo-header
